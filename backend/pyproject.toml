[project]
name = "axlr8"
version = "0.1.0"
description = "Automated lab throughput and bottleneck simulator"
requires-python = ">=3.11"
dependencies = [
    "simpy>=4.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axlr8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
